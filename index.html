<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telecom Field PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.css" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .bottom-sheet { transition: transform 0.3s ease, opacity 0.3s ease; }
    .bottom-sheet.hidden { transform: translateY(100%); opacity: 0; }
    .bottom-sheet.visible { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex flex-col min-h-screen">
    <header class="bg-slate-900 border-b border-slate-800 shadow-lg shadow-black/30 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-500 flex items-center justify-center text-2xl font-bold">PWA</div>
          <div>
            <h1 class="text-xl font-bold">Telecom Field Manager</h1>
            <p class="text-sm text-slate-400">Cadastro, mapas, checklist e relatórios offline/online</p>
          </div>
        </div>
        <div class="flex gap-3 flex-wrap">
          <button id="installPwa" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-semibold">Instalar PWA</button>
          <label class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold cursor-pointer" for="kmzInput">Importar KMZ</label>
          <input id="kmzInput" type="file" accept=".kmz,.kml" class="hidden">
          <button id="generateReport" class="px-4 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 rounded-lg text-sm font-semibold">Gerar PDF</button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-4 space-y-4">
      <section class="grid md:grid-cols-3 gap-4">
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold">Cadastro Rápido</h2>
            <span class="text-xs text-slate-400">Offline-first</span>
          </div>
          <form id="quickForm" class="space-y-3">
            <div>
              <label class="text-sm text-slate-400">Tipo</label>
              <select id="entityType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                <option value="central">Central</option>
                <option value="fibra">Fibra</option>
                <option value="caixa">Caixa de Emenda</option>
                <option value="cliente">Cliente</option>
                <option value="rompimento">Rompimento</option>
              </select>
            </div>
            <div>
              <label class="text-sm text-slate-400">Nome/Identificador</label>
              <input id="entityName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" placeholder="Ex: Estação Norte" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input id="latInput" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" placeholder="Lat" />
              <input id="lngInput" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" placeholder="Lng" />
            </div>
            <div id="fibraCapacityWrapper" class="hidden">
              <label class="text-sm text-slate-400">Capacidade da Fibra</label>
              <select id="fibraCapacity" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                <option>12FO</option><option>24FO</option><option>36FO</option><option>48FO</option><option>96FO</option><option>144FO</option>
              </select>
            </div>
            <button class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold" type="submit">Salvar Localmente</button>
          </form>
        </div>
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold">Checklist Mensal</h2>
            <span class="text-xs text-amber-400" id="checklistStatus">Aguardando</span>
          </div>
          <div class="space-y-2 text-sm">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-slate-400">Fase R/S/T (V)</label>
                <input id="voltageInput" type="number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="220">
              </div>
              <div>
                <label class="text-slate-400">Tensão total (V)</label>
                <input id="totalVoltage" type="number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="380">
              </div>
            </div>
            <div>
              <label class="text-slate-400">Ar-condicionado</label>
              <div class="grid grid-cols-3 gap-2">
                <input id="ac1" type="number" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="AC1">
                <input id="ac2" type="number" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="AC2">
                <input id="ac3" type="number" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="AC3 (BRotas)">
              </div>
            </div>
            <div class="flex items-center gap-2">
              <input id="cleanOk" type="checkbox" class="h-4 w-4">
              <label>Limpeza OK</label>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-slate-400">Nível combustível (%)</label>
                <input id="fuelLevel" type="number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="75">
              </div>
              <div>
                <label class="text-slate-400">Temperatura AC (°C)</label>
                <input id="tempAc" type="number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2" placeholder="22">
              </div>
            </div>
            <div>
              <label class="text-slate-400">Fotos / Vídeos (timestamp + geolocalização)</label>
              <input id="mediaInput" type="file" accept="image/*,video/*" capture="environment" multiple class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2">
            </div>
            <button id="saveChecklist" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold">Salvar checklist</button>
          </div>
        </div>
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold">Legenda & Filtros</h2>
            <span class="text-xs text-slate-400">Mapa</span>
          </div>
          <div class="space-y-2 text-sm text-slate-300">
            <div class="flex items-center gap-2"><span class="text-2xl">🏢</span><span>Estações</span></div>
            <div class="flex items-center gap-2"><span class="text-2xl">📦</span><span>Caixas de emenda</span></div>
            <div class="flex items-center gap-2"><span class="text-2xl">👤</span><span>Clientes</span></div>
            <div class="flex items-center gap-2"><span class="text-2xl">🧵</span><span>Rotas de fibra</span></div>
            <div class="pt-2 space-y-2">
              <label class="text-slate-400">Filtrar status</label>
              <select id="statusFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                <option value="all">Todos</option>
                <option value="operacional">Operacional</option>
                <option value="manutencao">Manutenção</option>
                <option value="rompida">Rompida</option>
              </select>
              <button id="toggleDistance" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold">Medição de rota real</button>
            </div>
          </div>
        </div>
      </section>

      <section class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-2 bg-slate-900/70 border border-slate-800 rounded-xl overflow-hidden">
          <div id="map" class="h-[520px]"></div>
        </div>
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">Caixas e Fusões</h2>
            <button id="addFusion" class="text-sm bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg">Nova conexão</button>
          </div>
          <div id="fusionDetails" class="text-sm text-slate-300 space-y-2 max-h-[460px] overflow-y-auto"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 rounded-t-2xl shadow-2xl shadow-black/40 bottom-sheet hidden">
    <div class="max-w-5xl mx-auto space-y-2">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-xs text-slate-400">Informações da fibra</p>
          <h3 id="sheetTitle" class="text-xl font-semibold"></h3>
        </div>
        <button id="closeSheet" class="text-slate-400 hover:text-white text-lg">&times;</button>
      </div>
      <div id="sheetContent" class="grid md:grid-cols-3 gap-3 text-sm"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.4.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/togeojson@0.16.0/dist/togeojson.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: [-46.633, -23.55],
      zoom: 12
    });

    const state = {
      stations: [
        { id: 'st1', name: 'Estação Central', coords: [-46.63, -23.54], status: 'operacional' },
        { id: 'st2', name: 'Estação BRotas', coords: [-46.65, -23.56], status: 'manutencao' }
      ],
      spliceBoxes: [
        { id: 'cx1', name: 'Caixa A', coords: [-46.64, -23.545], cables: [{ id: 'cb96', capacity: '96FO' }, { id: 'cb24', capacity: '24FO' }], status: 'operacional' },
        { id: 'cx2', name: 'Caixa B', coords: [-46.635, -23.57], cables: [{ id: 'cb48', capacity: '48FO' }], status: 'rompida' }
      ],
      clients: [
        { id: 'cl1', name: 'Cliente Alfa', coords: [-46.62, -23.55], status: 'operacional' },
        { id: 'cl2', name: 'Cliente Beta', coords: [-46.66, -23.565], status: 'manutencao' }
      ],
      fibers: [
        { id: 'fb1', name: 'Anel Principal', capacity: '96FO', start: 'st1', end: 'cx1', status: 'operacional', geometry: [[-46.63, -23.54], [-46.64, -23.545]] },
        { id: 'fb2', name: 'Cabo Cliente Alfa', capacity: '24FO', start: 'cx1', end: 'cl1', status: 'operacional', geometry: [[-46.64, -23.545], [-46.62, -23.55]] },
        { id: 'fb3', name: 'Anel Secundário', capacity: '48FO', start: 'st2', end: 'cx2', status: 'rompida', geometry: [[-46.65, -23.56], [-46.635, -23.57]] }
      ],
      fibersView: null,
      fusions: [
        { boxId: 'cx1', mapping: [ { fromCable: 'cb96', fiber: 1, toCable: 'cb96', toFiber: 1 }, { fromCable: 'cb96', fiber: 2, toCable: 'cb24', toFiber: 1 }, { fromCable: 'cb24', fiber: 2, toCable: null, toFiber: null } ] },
        { boxId: 'cx2', mapping: [ { fromCable: 'cb48', fiber: 1, toCable: null, toFiber: null } ] }
      ],
      distanceMode: false,
      selectedFiber: null,
      kmzLayers: 0,
      mediaWithGeo: []
    };

    const typeLookup = new Map();
    state.stations.forEach(s => typeLookup.set(s.id, { type: 'Estação', name: s.name, coords: s.coords }));
    state.spliceBoxes.forEach(c => typeLookup.set(c.id, { type: 'Caixa de Emenda', name: c.name, coords: c.coords }));
    state.clients.forEach(c => typeLookup.set(c.id, { type: 'Cliente', name: c.name, coords: c.coords }));

    map.on('load', () => {
      renderMarkers();
      renderFibers();
    });

    function renderMarkers() {
      const markers = [
        ...state.stations.map(s => ({ ...s, icon: '🏢' })),
        ...state.spliceBoxes.map(s => ({ ...s, icon: '📦' })),
        ...state.clients.map(s => ({ ...s, icon: '👤' }))
      ];
      markers.forEach(m => {
        const el = document.createElement('div');
        el.className = 'text-2xl drop-shadow-lg';
        el.textContent = m.icon;
        el.addEventListener('click', () => handleMarkerClick(m));
        new maplibregl.Marker(el).setLngLat(m.coords).addTo(map);
      });
    }

    const onFiberClick = (e) => {
      const feature = e.features[0];
      openBottomSheet(feature.properties);
      if (state.distanceMode) {
        state.selectedFiber = feature.properties;
        measureFiberDistance(feature.properties);
      }
    };

    function renderFibers() {
      const sourceId = 'fibers';
      const fibers = state.fibersView || state.fibers;
      if (map.getSource(sourceId)) map.removeLayer('fibers-layer'), map.removeSource(sourceId);
      map.addSource(sourceId, {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: fibers.map(f => ({
            type: 'Feature',
            properties: f,
            geometry: { type: 'LineString', coordinates: f.geometry }
          }))
        }
      });
      map.addLayer({
        id: 'fibers-layer',
        type: 'line',
        source: sourceId,
        paint: {
          'line-width': 4,
          'line-color': [
            'match', ['get', 'capacity'],
            '12FO', '#67e8f9', '24FO', '#22c55e', '36FO', '#a855f7', '48FO', '#f97316', '96FO', '#ef4444', '144FO', '#eab308', '#94a3b8'
          ]
        }
      });
      map.off('click', 'fibers-layer', onFiberClick);
      map.on('click', 'fibers-layer', onFiberClick);
    }

    function openBottomSheet(props) {
      const start = typeLookup.get(props.start);
      const end = typeLookup.get(props.end);
      document.getElementById('sheetTitle').textContent = `${props.name} (${props.capacity})`;
      document.getElementById('sheetContent').innerHTML = `
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <p class="text-slate-400 text-xs">Ponto inicial</p>
          <p class="font-semibold">${start?.type || 'N/D'} - ${start?.name || 'N/D'}</p>
          <button class="mt-2 px-3 py-1 bg-blue-600 rounded-lg text-xs" onclick="navigateTo(${start?.coords})">Navegar</button>
        </div>
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <p class="text-slate-400 text-xs">Ponto final</p>
          <p class="font-semibold">${end?.type || 'N/D'} - ${end?.name || 'N/D'}</p>
          <button class="mt-2 px-3 py-1 bg-blue-600 rounded-lg text-xs" onclick="navigateTo(${end?.coords})">Navegar</button>
        </div>
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <p class="text-slate-400 text-xs">Status & Medição</p>
          <p class="font-semibold">Capacidade: ${props.capacity}</p>
          <p id="fiberDistance" class="text-sm text-slate-300"></p>
        </div>`;
      const sheet = document.getElementById('bottomSheet');
      sheet.classList.remove('hidden');
      requestAnimationFrame(() => sheet.classList.add('visible'));
    }

    document.getElementById('closeSheet').addEventListener('click', () => {
      const sheet = document.getElementById('bottomSheet');
      sheet.classList.remove('visible');
      sheet.classList.add('hidden');
    });

    function handleMarkerClick(marker) {
      const box = state.spliceBoxes.find(c => c.id === marker.id);
      if (box) renderFusion(box.id);
    }

    function renderFusion(boxId) {
      const box = state.spliceBoxes.find(c => c.id === boxId);
      const fusions = state.fusions.find(f => f.boxId === boxId)?.mapping || [];
      const fusionContainer = document.getElementById('fusionDetails');
      const capacityInfo = box.cables.map(c => `${c.id} (${c.capacity})`).join(', ');
      fusionContainer.innerHTML = `
        <div class="bg-slate-800 border border-slate-700 rounded-lg p-3">
          <p class="text-sm font-semibold">${box.name}</p>
          <p class="text-xs text-slate-400">Cabos: ${capacityInfo}</p>
        </div>
        <div class="space-y-2">
          ${fusions.map(f => `<div class="p-2 bg-slate-800/80 rounded border border-slate-700">Fibra ${f.fiber} de ${f.fromCable} ⇄ ${f.toCable || '—'} ${f.toFiber || ''}</div>`).join('') || '<p class="text-slate-400">Nenhuma fusão registrada.</p>'}
        </div>`;
    }
    renderFusion('cx1');

    document.getElementById('addFusion').addEventListener('click', () => {
      const boxId = prompt('ID da caixa (ex: cx1)');
      const fromCable = prompt('Cabo de origem (ex: cb96)');
      const fiber = Number(prompt('Fibra de origem (número)'));
      const toCable = prompt('Cabo de destino (pode ficar vazio)') || null;
      const toFiber = toCable ? Number(prompt('Fibra de destino')) : null;
      const boxFusion = state.fusions.find(f => f.boxId === boxId);
      if (boxFusion) boxFusion.mapping.push({ fromCable, fiber, toCable, toFiber });
      else state.fusions.push({ boxId, mapping: [{ fromCable, fiber, toCable, toFiber }] });
      renderFusion(boxId);
    });

    document.getElementById('statusFilter').addEventListener('change', (e) => {
      const status = e.target.value;
      state.fibersView = status === 'all' ? null : state.fibers.filter(f => f.status === status);
      renderFibers();
    });

    function measureFiberDistance(props) {
      const line = turf.lineString(props.geometry);
      const km = turf.length(line, { units: 'kilometers' });
      document.getElementById('fiberDistance').textContent = `Comprimento real: ${km.toFixed(2)} km`;
    }

    document.getElementById('toggleDistance').addEventListener('click', () => {
      state.distanceMode = !state.distanceMode;
      document.getElementById('toggleDistance').textContent = state.distanceMode ? 'Selecionar pontos no mapa...' : 'Medição de rota real';
    });

    function navigateTo(lng, lat) {
      if (lng === undefined) return;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
    }

    document.getElementById('kmzInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      if (file.name.endsWith('.kmz')) {
        const zip = await JSZip.loadAsync(buffer);
        const kmlFile = zip.file(/.kml$/i)[0];
        const kmlText = await kmlFile.async('text');
        addKmlToMap(kmlText, file.name);
      } else {
        const text = new TextDecoder().decode(buffer);
        addKmlToMap(text, file.name);
      }
    });

    function addKmlToMap(kmlText, name) {
      const dom = new DOMParser().parseFromString(kmlText, 'text/xml');
      const geojson = toGeoJSON.kml(dom);
      const sourceId = `kmz-${state.kmzLayers++}`;
      map.addSource(sourceId, { type: 'geojson', data: geojson });
      map.addLayer({ id: `${sourceId}-layer`, type: 'line', source: sourceId, paint: { 'line-color': '#22d3ee', 'line-width': 3 } });
      map.addLayer({ id: `${sourceId}-points`, type: 'circle', source: sourceId, paint: { 'circle-radius': 6, 'circle-color': '#f472b6' }, filter: ['==', '$type', 'Point'] });
      alert(`${name} importado e exibido no mapa.`);
    }

    document.getElementById('quickForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('entityType').value;
      const name = document.getElementById('entityName').value;
      const lat = parseFloat(document.getElementById('latInput').value);
      const lng = parseFloat(document.getElementById('lngInput').value);
      if (Number.isFinite(lat) && Number.isFinite(lng)) {
        const icon = type === 'central' ? '🏢' : type === 'caixa' ? '📦' : type === 'cliente' ? '👤' : '🧵';
        const el = document.createElement('div');
        el.textContent = icon;
        el.className = 'text-2xl drop-shadow-lg';
        new maplibregl.Marker(el).setLngLat([lng, lat]).addTo(map);
      }
      localStorage.setItem('telecom-quick-entity', JSON.stringify({ type, name, lat, lng, capacity: document.getElementById('fibraCapacity').value }));
      alert('Registro salvo localmente. Sincronize quando houver internet.');
      e.target.reset();
      document.getElementById('fibraCapacityWrapper').classList.add('hidden');
    });

    document.getElementById('entityType').addEventListener('change', (e) => {
      document.getElementById('fibraCapacityWrapper').classList.toggle('hidden', e.target.value !== 'fibra');
    });

    document.getElementById('saveChecklist').addEventListener('click', async () => {
      const voltage = Number(document.getElementById('voltageInput').value || 0);
      const total = Number(document.getElementById('totalVoltage').value || 0);
      const temp = Number(document.getElementById('tempAc').value || 0);
      const fuel = Number(document.getElementById('fuelLevel').value || 0);
      const status = (voltage < 210 || temp > 25 || fuel < 50) ? 'Não conforme' : 'OK';
      document.getElementById('checklistStatus').textContent = status;
      document.getElementById('checklistStatus').className = status === 'OK' ? 'text-xs text-emerald-400' : 'text-xs text-amber-400';
      const files = document.getElementById('mediaInput').files;
      state.mediaWithGeo = [];
      if (navigator.geolocation && files.length) {
        const position = await new Promise(resolve => navigator.geolocation.getCurrentPosition(resolve, resolve));
        for (const file of files) {
          state.mediaWithGeo.push({ name: file.name, time: new Date().toISOString(), coords: position.coords });
        }
      }
      localStorage.setItem('telecom-checklist', JSON.stringify({ voltage, total, temp, fuel, media: state.mediaWithGeo }));
      alert('Checklist salvo com validação e geolocalização.');
    });

    document.getElementById('generateReport').addEventListener('click', () => {
      const checklist = JSON.parse(localStorage.getItem('telecom-checklist') || '{}');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('Relatório de Manutenção', 14, 16);
      doc.text(`Tensão: ${checklist.voltage || '-'} / Total: ${checklist.total || '-'}`, 14, 26);
      doc.text(`Combustível: ${checklist.fuel || '-'}% | Temperatura AC: ${checklist.temp || '-'}°C`, 14, 36);
      doc.text('Mídias com localização:', 14, 46);
      (checklist.media || []).forEach((m, idx) => {
        doc.text(`${idx + 1}. ${m.name} @ ${m.coords?.latitude?.toFixed(5)}, ${m.coords?.longitude?.toFixed(5)} - ${m.time}`, 16, 56 + idx * 10);
      });
      doc.save('relatorio-manutencao.pdf');
    });

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    document.getElementById('installPwa').addEventListener('click', async () => {
      if (!deferredPrompt) return alert('Instalação não disponível agora.');
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
